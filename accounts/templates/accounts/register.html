<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - SecureCrypt</title>


    <style>

        /* ========================================
           GLOBAL
        ======================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;

            font-family:
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(37, 99, 235, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(79, 70, 229, 0.35),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #020617,
                    #070b1f,
                    #11133b
                );

        }


        /* ========================================
           REGISTER CONTAINER
        ======================================== */

        .register-container {

            width: 100%;

            max-width: 470px;

        }


        /* ========================================
           REGISTER CARD
        ======================================== */

        .register-card {

            width: 100%;

            padding: 36px 38px;

            border-radius: 20px;

            background:
                rgba(15, 23, 42, 0.92);

            border:
                1px solid
                rgba(148, 163, 184, 0.18);

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.45);

            backdrop-filter:
                blur(12px);

        }


        /* ========================================
           LOGO
        ======================================== */

        .logo {

            width: 64px;

            height: 64px;

            margin:
                0 auto 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 17px;

            font-size: 34px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            box-shadow:
                0 10px 30px
                rgba(37, 99, 235, 0.35);

        }


        /* ========================================
           BRAND
        ======================================== */

        .brand {

            text-align: center;

            font-size: 27px;

            font-weight: 700;

            color: #f8fafc;

            margin: 0;

        }


        .subtitle {

            text-align: center;

            margin:
                7px 0 28px;

            color: #94a3b8;

            font-size: 14px;

        }


        /* ========================================
           FORM TITLE
        ======================================== */

        .form-title {

            margin:
                0 0 20px;

            color: #f8fafc;

            font-size: 19px;

            font-weight: 700;

        }


        /* ========================================
           DJANGO MESSAGES
        ======================================== */

        .messages {

            padding:
                12px 14px;

            margin-bottom: 18px;

            border-radius: 9px;

            background:
                rgba(239, 68, 68, 0.12);

            border:
                1px solid
                rgba(239, 68, 68, 0.25);

            color: #fca5a5;

            font-size: 13px;

        }


        .messages p {

            margin: 3px 0;

        }


        /* ========================================
           LABEL
        ======================================== */

        label {

            display: block;

            margin:
                17px 0 7px;

            color: #cbd5e1;

            font-size: 13px;

            font-weight: 600;

        }


        /* ========================================
           INPUT
        ======================================== */

        input {

            width: 100%;

            height: 44px;

            padding:
                0 13px;

            border-radius: 9px;

            border:
                1px solid
                #334155;

            outline: none;

            background:
                #0f172a;

            color: #f8fafc;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

        }


        input::placeholder {

            color: #64748b;

        }


        input:hover {

            border-color:
                #475569;

        }


        input:focus {

            border-color:
                #3b82f6;

            background:
                #111827;

            box-shadow:
                0 0 0 3px
                rgba(59, 130, 246, 0.12);

        }


        /* ========================================
           PASSWORD WRAPPER
        ======================================== */

        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-right: 48px;

        }


        .toggle-password {

            position: absolute;

            top: 50%;

            right: 9px;

            transform:
                translateY(-50%);

            width: 34px;

            height: 34px;

            margin: 0;

            padding: 0;

            border: none;

            border-radius: 7px;

            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            font-size: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.2s ease,
                color 0.2s ease;

        }


        .toggle-password:hover {

            background:
                rgba(59, 130, 246, 0.1);

            color: #60a5fa;

        }


        /* ========================================
           PASSWORD STRENGTH
        ======================================== */

        .password-strength {

            margin-top: 9px;

        }


        .strength-bar {

            width: 100%;

            height: 6px;

            overflow: hidden;

            border-radius: 10px;

            background:
                #1e293b;

        }


        #strength-progress {

            height: 100%;

            width: 0%;

            border-radius: 10px;

            transition:
                width 0.3s ease,
                background 0.3s ease;

        }


        #strength-text {

            margin:
                6px 0 0;

            font-size: 11px;

            color: #64748b;

        }


        /* ========================================
           REGISTER BUTTON
        ======================================== */

        .register-btn {

            width: 100%;

            height: 44px;

            margin-top: 26px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(37, 99, 235, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;

        }


        .register-btn:hover {

            transform:
                translateY(-1px);

            filter:
                brightness(1.08);

            box-shadow:
                0 12px 30px
                rgba(37, 99, 235, 0.35);

        }


        .register-btn:active {

            transform:
                translateY(0);

        }


        /* ========================================
           BACK TO LOGIN
        ======================================== */

        .login-text {

            text-align: center;

            margin-top: 22px;

            color: #94a3b8;

            font-size: 13px;

        }


        .login-text a {

            margin-left: 4px;

            color: #60a5fa;

            font-weight: 600;

            text-decoration: none;

        }


        .login-text a:hover {

            color: #93c5fd;

            text-decoration: underline;

        }


        /* ========================================
           SECURITY FOOTER
        ======================================== */

        .security {

            margin-top: 22px;

            padding-top: 17px;

            border-top:
                1px solid
                rgba(148, 163, 184, 0.12);

            text-align: center;

            color: #64748b;

            font-size: 11px;

        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 500px) {

            body {

                padding:
                    20px 12px;

                align-items: flex-start;

            }


            .register-card {

                padding:
                    30px 22px;

                margin-top: 20px;

            }


            .logo {

                width: 58px;

                height: 58px;

                font-size: 30px;

            }


            .brand {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <div class="register-card">


        <!-- ====================================
             LOGO
        ==================================== -->

        <div class="logo">
            🔐
        </div>


        <!-- ====================================
             BRAND
        ==================================== -->

        <h1 class="brand">
            SecureCrypt
        </h1>


        <p class="subtitle">
            Secure file encryption and protection
        </p>


        <!-- ====================================
             TITLE
        ==================================== -->

        <h2 class="form-title">
            Create Account
        </h2>


        <!-- ====================================
             DJANGO MESSAGES
        ==================================== -->

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <p>
                        {{ message }}
                    </p>

                {% endfor %}

            </div>

        {% endif %}


        <!-- ====================================
             REGISTER FORM
        ==================================== -->

        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <label for="username">
                👤 Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                📧 Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- PHONE -->

            <label for="phone">
                📱 Phone Number
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                🔑 Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="passwordToggle"
                    onclick="togglePassword()"
                >
                    👁️
                </button>

            </div>


            <!-- PASSWORD STRENGTH -->

            <div class="password-strength">

                <div class="strength-bar">

                    <div
                        id="strength-progress"
                    ></div>

                </div>


                <p id="strength-text">
                    Password strength
                </p>

            </div>


            <!-- CONFIRM PASSWORD -->

            <label for="confirm_password">
                🔒 Confirm Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="confirmToggle"
                    onclick="toggleConfirmPassword()"
                >
                    👁️
                </button>

            </div>


            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                class="register-btn"
            >
                🔐 Create Account
            </button>

        </form>


        <!-- ====================================
             LOGIN
        ==================================== -->

        <div class="login-text">

            Already have an account?

            <a href="{% url 'login' %}">
                Back to Login
            </a>

        </div>


        <!-- ====================================
             SECURITY
        ==================================== -->

        <div class="security">

            🛡️ Your account is protected by encryption

        </div>


    </div>

</div>



<script>


/* ============================================
   PASSWORD VISIBILITY
============================================ */

function togglePassword() {

    const password =
        document.getElementById(
            "password"
        );

    const button =
        document.getElementById(
            "passwordToggle"
        );


    if (
        password.type === "password"
    ) {

        password.type = "text";

        button.innerHTML = "🙈";

    }

    else {

        password.type = "password";

        button.innerHTML = "👁️";

    }

}



/* ============================================
   CONFIRM PASSWORD VISIBILITY
============================================ */

function toggleConfirmPassword() {

    const password =
        document.getElementById(
            "confirm_password"
        );

    const button =
        document.getElementById(
            "confirmToggle"
        );


    if (
        password.type === "password"
    ) {

        password.type = "text";

        button.innerHTML = "🙈";

    }

    else {

        password.type = "password";

        button.innerHTML = "👁️";

    }

}



/* ============================================
   PASSWORD STRENGTH
============================================ */

const passwordInput =
    document.getElementById(
        "password"
    );

const strengthProgress =
    document.getElementById(
        "strength-progress"
    );

const strengthText =
    document.getElementById(
        "strength-text"
    );


passwordInput.addEventListener(
    "input",
    function () {

        const password =
            passwordInput.value;

        let score = 0;


        if (password.length >= 8) {
            score++;
        }

        if (/[a-z]/.test(password)) {
            score++;
        }

        if (/[A-Z]/.test(password)) {
            score++;
        }

        if (/[0-9]/.test(password)) {
            score++;
        }

        if (/[^A-Za-z0-9]/.test(password)) {
            score++;
        }


        /* EMPTY */

        if (password.length === 0) {

            strengthProgress.style.width =
                "0%";

            strengthProgress.style.background =
                "transparent";

            strengthText.textContent =
                "Password strength";

            strengthText.style.color =
                "#64748b";

        }


        /* WEAK */

        else if (score <= 2) {

            strengthProgress.style.width =
                "33%";

            strengthProgress.style.background =
                "#ef4444";

            strengthText.textContent =
                "Weak password";

            strengthText.style.color =
                "#ef4444";

        }


        /* MEDIUM */

        else if (score <= 4) {

            strengthProgress.style.width =
                "66%";

            strengthProgress.style.background =
                "#f59e0b";

            strengthText.textContent =
                "Medium password";

            strengthText.style.color =
                "#f59e0b";

        }


        /* STRONG */

        else {

            strengthProgress.style.width =
                "100%";

            strengthProgress.style.background =
                "#22c55e";

            strengthText.textContent =
                "Strong password";

            strengthText.style.color =
                "#22c55e";

        }

    }

);

</script>


</body>

</html>
