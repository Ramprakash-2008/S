<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - SecureCrypt</title>

   <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at top left,
            #1e3a8a 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            #312e81 0%,
            transparent 35%
        ),
        #020617;

    color: #e2e8f0;

    overflow: hidden;
}


/* =========================================
   BACKGROUND EFFECT
========================================= */

body::before {
    content: "";

    position: fixed;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    background: rgba(37, 99, 235, 0.12);

    filter: blur(80px);

    top: -150px;
    left: -150px;

    pointer-events: none;
}

body::after {
    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: rgba(99, 102, 241, 0.10);

    filter: blur(80px);

    bottom: -150px;
    right: -100px;

    pointer-events: none;
}


/* =========================================
   LOGIN CONTAINER
========================================= */

.login-container {
    width: 100%;
    max-width: 440px;

    padding: 20px;

    position: relative;
    z-index: 1;
}


/* =========================================
   LOGIN CARD
========================================= */

.login-card {

    background: rgba(15, 23, 42, 0.88);

    border: 1px solid rgba(148, 163, 184, 0.18);

    backdrop-filter: blur(18px);

    padding: 42px;

    border-radius: 20px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
}


/* =========================================
   LOGO
========================================= */

.logo {

    width: 72px;
    height: 72px;

    margin: 0 auto 18px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    font-size: 36px;

    box-shadow:
        0 10px 30px
        rgba(37, 99, 235, 0.35);
}


/* =========================================
   BRAND
========================================= */

.brand {

    text-align: center;

    font-size: 30px;

    font-weight: 700;

    color: #f8fafc;

    letter-spacing: -0.5px;
}


/* =========================================
   SUBTITLE
========================================= */

.subtitle {

    text-align: center;

    color: #94a3b8;

    margin-top: 9px;

    margin-bottom: 30px;

    font-size: 14px;
}


/* =========================================
   MESSAGES
========================================= */

.message {

    padding: 12px 14px;

    margin-bottom: 18px;

    border-radius: 9px;

    background: rgba(239, 68, 68, 0.12);

    border: 1px solid rgba(239, 68, 68, 0.25);

    color: #fca5a5;

    font-size: 14px;
}


/* =========================================
   LABEL
========================================= */

label {

    display: block;

    margin-bottom: 8px;

    margin-top: 18px;

    font-size: 14px;

    font-weight: 600;

    color: #cbd5e1;
}


/* =========================================
   INPUT
========================================= */

input {

    width: 100%;

    padding: 14px 15px;

    border: 1px solid #334155;

    border-radius: 10px;

    background: #0f172a;

    color: #f8fafc;

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

    .login-btn,
    .home-btn {
        width: 100%;
        height: 55px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        box-sizing: border-box;
    }

    .login-btn {
        border: none;
        background: linear-gradient(90deg, #2563eb, #4f46e5);
        color: white;
        cursor: pointer;
    }

    .home-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
        border: 1px solid #31527a;
        background: transparent;
        color: #b9c7dc;
        text-decoration: none;
    }

    .home-btn:hover {
        background: #16243a;
        color: white;
    }

input::placeholder {
    color: #64748b;
}

input:focus {

    border-color: #3b82f6;

    background: #111c31;

    box-shadow:
        0 0 0 3px
        rgba(59, 130, 246, 0.12);
}


/* =========================================
   PASSWORD
========================================= */

.password-wrapper {

    position: relative;
}

.password-wrapper input {

    padding-right: 52px;
}


/* =========================================
   PASSWORD TOGGLE
========================================= */

.toggle-password {

    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    width: 38px;
    height: 38px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #94a3b8;

    cursor: pointer;

    font-size: 18px;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

.toggle-password:hover {

    background: #1e293b;

    color: #f8fafc;
}


/* =========================================
   FORGOT PASSWORD
========================================= */

.forgot-password {

    text-align: right;

    margin-top: 10px;
}

.forgot-password a {

    color: #60a5fa;

    font-size: 14px;

    text-decoration: none;

    transition: color 0.2s ease;
}

.forgot-password a:hover {

    color: #93c5fd;

    text-decoration: underline;
}


/* =========================================
   LOGIN BUTTON
========================================= */

.login-btn {

    width: 100%;

    margin-top: 28px;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 22px
        rgba(37, 99, 235, 0.25);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
}

.login-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 12px 28px
        rgba(37, 99, 235, 0.35);

    filter: brightness(1.08);
}

.login-btn:active {

    transform: translateY(0);
}


/* =========================================
   REGISTER
========================================= */

.register-text {

    text-align: center;

    margin-top: 25px;

    color: #94a3b8;

    font-size: 14px;
}

.register-text a {

    color: #60a5fa;

    text-decoration: none;

    font-weight: 700;

    margin-left: 4px;
}

.register-text a:hover {

    color: #93c5fd;

    text-decoration: underline;
}


/* =========================================
   SECURITY MESSAGE
========================================= */

.security {

    text-align: center;

    margin-top: 25px;

    padding-top: 20px;

    border-top: 1px solid #1e293b;

    font-size: 12px;

    color: #64748b;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 500px) {

    body {
        overflow: auto;
    }

    .login-container {
        padding: 15px;
    }

    .login-card {
        padding: 32px 22px;
        border-radius: 16px;
    }

    .logo {
        width: 62px;
        height: 62px;
        font-size: 30px;
    }

    .brand {
        font-size: 26px;
    }

}

</style>
</head>


<body>


<div class="login-container">

    <div class="login-card">


        <div class="logo">
            🔐
        </div>


        <div class="brand">
            SecureCrypt
        </div>


        <p class="subtitle">
            Secure file encryption and protection
        </p>


        <!-- Messages -->

        {% if messages %}

            {% for message in messages %}

                <div class="message">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <!-- Login Form -->

        <form method="POST">

            {% csrf_token %}


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >


            <label>
                Password
            </label>


            <div class="password-wrapper">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="toggleLoginPassword()"
                    id="loginToggle"
                >
                    👁️
                </button>

            </div>
            <div class="forgot-password">
    <a href="{% url 'forgot_password' %}">
        Forgot Password?
    </a>
</div>

            <button
                type="submit"
                class="login-btn"
            >
                🔐 Login Securely
            </button>
       <a href="{% url 'home' %}" class="home-btn">
    ← Back to Home
</a>
        </form>


        <div class="register-text">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </div>


        <div class="security">

            🛡️ Your files are protected with encryption

        </div>


    </div>

</div>


<script>

function toggleLoginPassword() {

    const password =
        document.getElementById("loginPassword");

    const button =
        document.getElementById("loginToggle");


    if (password.type === "password") {

        password.type = "text";

        button.innerHTML = "🙈";

    } else {

        password.type = "password";

        button.innerHTML = "👁️";

    }

}

</script>


</body>

</html>
